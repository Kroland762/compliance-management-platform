name: CI

on:
  pull_request:
  push:
    branches: [main, master]

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: compliance_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d compliance_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      NODE_ENV: development
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: compliance_ci
      JWT_SECRET: ci-only-secret-at-least-32-characters-long
      ENCRYPTION_KEY: ci-only-encryption-secret-at-least-32-characters
      SEED_ADMIN_USERNAME: admin
      SEED_ADMIN_PASSWORD: Admin1234!
      E2E_ADMIN_USERNAME: admin
      E2E_ADMIN_PASSWORD: Admin1234!
      E2E_MUTATION_TENANT_SLUG: ci
      E2E_AUDITOR_USERNAME: auditor
      E2E_AUDITOR_PASSWORD: Auditor1234!
      RUN_PG_INTEGRATION: "true"
      MIGRATION_COMPAT_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/ci_migration_compat_test
      ALLOW_PRIVATE_DATASOURCE_HOSTS: "true"
      BUSINESS_TIME_ZONE: Asia/Shanghai
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Install backend
        working-directory: backend
        run: npm ci

      - name: Install frontend
        working-directory: frontend
        run: npm ci

      - name: Migrate and seed
        working-directory: backend
        run: |
          npm run migrate:up
          npm run seed
          npm run seed:e2e
          npm run migrate:up
          npm run migrate:status

      - name: Production dependency audit
        run: |
          npm --prefix backend audit --omit=dev
          npm --prefix frontend audit --omit=dev

      - name: Compose and deployment script validation
        run: |
          docker compose --env-file .env.docker.example config --quiet
          bash -n deploy/cloud-preflight.sh deploy/render-nginx.sh backend/scripts/backup.sh backend/scripts/restore.sh
          ./deploy/render-nginx.sh .env.docker.example /tmp/compliance-nginx.conf

      - name: Create isolated legacy migration compatibility database
        env:
          PGPASSWORD: postgres
        run: createdb --host=127.0.0.1 --port=5432 --username=postgres ci_migration_compat_test

      - name: Backend unit and PostgreSQL integration tests
        working-directory: backend
        run: npm run test:ci

      - name: Frontend tests
        working-directory: frontend
        run: npm run test:ci

      - name: Build backend
        working-directory: backend
        run: npm run build

      - name: Build frontend and enforce chunk budget
        working-directory: frontend
        run: npm run build

      - name: Build production images and validate Nginx
        run: |
          docker compose --env-file .env.docker.example --profile ops build
          tls_dir="$(mktemp -d)"
          trap 'rm -rf "$tls_dir"' EXIT
          ./deploy/render-nginx.sh .env.docker.example "$tls_dir/default.conf"
          mkdir -p "$tls_dir/certs"
          openssl req -x509 -nodes -newkey rsa:2048 -days 1 \
            -subj '/CN=compliance.example.com' \
            -keyout "$tls_dir/certs/privkey.pem" \
            -out "$tls_dir/certs/fullchain.pem" >/dev/null 2>&1
          docker run --rm \
            -v "$tls_dir/default.conf:/etc/nginx/conf.d/default.conf:ro" \
            -v "$tls_dir/certs:/etc/letsencrypt/live/compliance.example.com:ro" \
            nginx:alpine nginx -t

      - name: Install Playwright Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Playwright end-to-end
        working-directory: frontend
        run: npm run test:e2e

      - name: Upload Playwright diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-diagnostics
          path: |
            frontend/playwright-report
            frontend/test-results
          if-no-files-found: ignore
          retention-days: 7

      - name: Diff hygiene
        run: git diff --check
