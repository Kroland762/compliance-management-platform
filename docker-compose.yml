version: '3.8'

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: audit_platform
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: audit_platform_pass
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U admin -d audit_platform']
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - '3001:3001'
    environment:
      NODE_ENV: production
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: audit_platform
      DB_USER: admin
      DB_PASSWORD: audit_platform_pass
      JWT_SECRET: change-this-to-a-random-32-char-string
      JWT_EXPIRES_IN: '900'
      JWT_REFRESH_EXPIRES_IN: '86400'
      ENCRYPTION_KEY: change-this-to-another-random-string
      FRONTEND_URL: http://localhost
      UPLOAD_DIR: /app/uploads
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - uploads:/app/uploads

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - '80:80'
    depends_on:
      - backend

volumes:
  pgdata:
  uploads:
