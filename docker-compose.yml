version: '3.8'

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: compliance_management_platform
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: compliance_management_platform_pass
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U admin -d compliance_management_platform']
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - '3001:3001'
    environment:
      NODE_ENV: production
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: compliance_management_platform
      DB_USER: admin
      DB_PASSWORD: compliance_management_platform_pass
      DB_SSL: 'false'
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET to a random value of at least 32 characters}
      JWT_EXPIRES_IN: '900'
      JWT_REFRESH_EXPIRES_IN: '86400'
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?Set ENCRYPTION_KEY to a random value}
      FRONTEND_URL: http://localhost
      UPLOAD_DIR: /app/uploads
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - uploads:/app/uploads

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - '80:80'
    depends_on:
      - backend

volumes:
  pgdata:
  uploads:
